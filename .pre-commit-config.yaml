# pre-commit: 提交时跑 ruff 与通用检查；pre-push: 推送前跑全量测试
# 安装：make precommit（或 uv run pre-commit install --hook-type pre-commit --hook-type pre-push）
# 注意：首次运行需克隆 GitHub 上的 hook 仓库，国内网络可能需要代理
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest（推送前全量测试）
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
