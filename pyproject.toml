[project]
name = "wechat-mp-autopilot"
version = "0.1.0"
description = "公众号 AI 自动化写作流水线：选题 → 写作 → 去AI味 → 标题 → 排版 → 配图 → 草稿箱 →（企业号）自动发布"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "wechat-mp-autopilot contributors" }]
keywords = ["wechat", "official-account", "公众号", "ai-writing", "automation", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: News/Diary",
]
dependencies = [
    "openai>=1.40,<4",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "mistune>=3.0,<4",
    "pillow>=12.3,<13",   # 11.x 有已知 CVE（PYSEC-2026-xxxx），12.3 修复
]
[project.urls]
Homepage = "https://github.com/animacaeli/wechat-mp-autopilot"
Issues = "https://github.com/animacaeli/wechat-mp-autopilot/issues"

[project.scripts]
autopilot = "autopilot.cli:main"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 默认使用清华 PyPI 镜像（本项目主要面向国内用户；海外贡献者可删除此块改用官方源）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort（import 排序）
    "UP",  # pyupgrade（现代化语法）
    "B",   # flake8-bugbear（常见陷阱）
    "RUF", # ruff 自身规则
]
ignore = [
    "RUF001", # 字符串中的全角标点（本项目是中文项目，全角标点是本体不是笔误）
    "RUF002", # 注释中的全角标点，同上
    "RUF003", # docstring 中的全角标点，同上
]
