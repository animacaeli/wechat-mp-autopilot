[project]
name = "wechat-mp-autopilot"
version = "0.1.0"
description = "公众号 AI 自动化写作流水线：选题 → 写作 → 去AI味 → 标题 → 排版 → 配图 → 草稿箱 →（企业号）自动发布"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40,<2",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "mistune>=3.0,<4",
    "pillow>=10.0,<12",
]

[project.scripts]
autopilot = "autopilot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
